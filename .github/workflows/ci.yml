name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check flows
        run: npm run check:flows

      - name: Test
        run: npm run test

# The e2e job was removed: it never produced a Playwright report in CI, failed on
# every branch from 2026-07-26 onward, and its permanent red trained everyone to
# ignore the whole workflow. The specs still live in e2e/ — run `npm run e2e`
# locally before a change that rewrites panel markup, and before a pitch.
